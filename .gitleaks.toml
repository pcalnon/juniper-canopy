# Gitleaks configuration for JuniperCanopy
# See: https://github.com/gitleaks/gitleaks#configuration
#
# 2026-10-25: until this date the file had no `[extend]` table, and a gitleaks v8
# config without one loads ONLY its own `[[rules]]` -- of which it has none. CI's
# Gitleaks step (ci.yml, Security Scans job) therefore ran with ZERO rules and
# passed vacuously on every push, pull request and dispatched run: a fabricated
# GitHub token went through it while gitleaks' built-in config flags the same
# token. juniper-ml#2203 found and fixed the same defect there.
# `[extend] useDefault = true` below loads gitleaks' built-in ruleset; the
# allowlist EXTENDS it. src/tests/regression/test_gitleaks_config.py pins that
# the table is present and that the real engine fires.
#
# The built-in ruleset reports historical false positives. Those are in
# .gitleaksignore, each COMMIT-scoped and under a comment naming its class.
#
# Usage (CI and a local run both auto-discover this file and .gitleaksignore):
#   gitleaks git --redact          # committed history
#   gitleaks dir --redact .        # the working tree, INCLUDING gitignored files

# Load gitleaks' built-in rules; the allowlist below EXTENDS them.
# Removing this table silently empties the ruleset again (see the header).
[extend]
useDefault = true

[allowlist]
  description = "Allowlist for known historical false positives"

  # Conda environment files contain `<package>=<version>=<build_hash>` triples.
  # The build_hash component is high-entropy (3.5–3.7) and trips the
  # generic-api-key rule, but it is a conda package build hash, not a secret.
  # Example: ``fastapi-core=0.122.0=pyh1bdc77b_0`` ⇒ build hash ``pyh1bdc77b_0``.
  # Documentation files under ``notes/mcp/`` contain example API request snippets
  # using placeholder strings (e.g. ``x-api-key: <YOUR_KEY>``) that gitleaks
  # mis-classifies; these are illustrative only and do not contain real secrets.
  paths = [
    '''conf/conda_environment.*\.ya?ml''',
    '''conf/.*\.lock''',
    '''notes/mcp/.*''',
  ]
