---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperCanopy
# Application:   juniper_canopy
# File Name:     lockfile-update.yml
# Author:        Paul Calnon
# Version:       0.1.0
#
# Date Created:  2026-03-02
# Last Modified: 2026-03-02
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Automatically regenerates requirements.lock when:
#      - Dependabot pushes a dependency update to a dependabot/pip/** branch, OR
#      - A pull request modifies pyproject.toml (covers manual min-version bumps
#        like the 2026-05-07 juniper-observability>=0.2.0 floor change that
#        otherwise leaves main red until a manual regen).
#
#    Runs uv pip compile to regenerate the lockfile and commits the result back
#    to the source branch so Docker builds and the Lockfile Freshness gate stay
#    in sync without engineer intervention.
#
#    Uses CROSS_REPO_DISPATCH_TOKEN (not GITHUB_TOKEN) so the push re-triggers CI.
#    main and develop are excluded from the pull_request trigger by branch
#    targeting (PRs targeting these branches still trigger; the regen pushes to
#    the PR head branch, never to main/develop directly).
#
# References:
#    - Step 7.5.2: Dependency Update Workflow (POLYREPO_MIGRATION_PLAN.md)
#    - notes/LOCKFILE_FRESHNESS_REDESIGN_2026-05-04.md (juniper-ml)
#####################################################################################################################################################################################################

name: Update Lockfile

on:
  push:
    branches:
      - dependabot/pip/**
  pull_request:
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update requirements.lock
    runs-on: ubuntu-latest
    # Skip PRs from forks — they cannot push back to the head branch with our
    # token, and we do not accept third-party PRs in this single-author repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          # On pull_request, check out the PR head branch (not the merge ref)
          # so we can push the regen commit back. ${{ github.head_ref }} is set
          # for pull_request events; ${{ github.ref }} is the canonical fallback
          # for push events.
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Regenerate requirements.lock
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Regenerate Lockfile                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # --upgrade is required because uv pip compile reads the existing -o
          # file as pins by default and won't bump transitive deps without it.
          # Writing directly to requirements.lock keeps the autogenerated
          # header path correct (no /tmp/... leak).
          uv pip compile pyproject.toml \
            --extra juniper-data \
            --extra juniper-cascor \
            --extra observability \
            --upgrade \
            -o requirements.lock

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if git diff --cached --quiet; then
            echo "::notice::Lockfile already up to date — no commit needed"
          else
            # Pick a commit message tag that matches the trigger so the audit
            # trail reads naturally. The "[dependabot skip]" tag also keeps
            # Dependabot from rebasing on top of our regen.
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              MSG="chore(deps): auto-regenerate requirements.lock after pyproject change"
            else
              MSG="[dependabot skip] Update requirements.lock"
            fi
            git commit -m "$MSG"
            git push
          fi
