name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "bandit[sarif]" pip-audit
          pip install -e ".[dev]"

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run Bandit (SAST)
        run: |
          bandit -r src -c .bandit.yml -f sarif -o reports/security/bandit.sarif --exit-zero
          bandit -r src -c .bandit.yml --confidence-level medium --severity-level medium

      - name: Run pip-audit (Dependency Vulnerabilities)
        # --skip-editable: drop --strict (pip-audit otherwise treats
        # the editable juniper-canopy install as a fatal "dependency
        # not found on PyPI" since it's a local project, not a
        # release). See juniper-ml/.github/workflows/ci.yml for the
        # same pattern.
        run: pip-audit --desc on --skip-editable

      - name: Upload Security Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: security-reports
          path: reports/security/
          retention-days: 30
