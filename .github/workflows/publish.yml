---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperCanopy
# Application:   juniper_canopy
# File Name:     publish.yml
# Author:        Paul Calnon
# Version:       0.1.0
#
# Date Created:  2026-02-26
# Last Modified: 2026-02-26
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions publish pipeline for juniper-canopy.
#    Triggered by GitHub release. Publishes to TestPyPI first (with install
#    verification), then to PyPI. Uses OIDC trusted publishing (no API tokens).
#
#####################################################################################################################################################################################################

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Build: Validate the package before publishing
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      # `twine check` reads metadata and the README; it cannot tell whether the wheel
      # carries the modules its own code imports. Releases 0.5.0-0.8.0 all passed it while
      # shipping a wheel whose dashboard could not be imported (canopy#631). This runs
      # against the artifact about to ship, before TestPyPI and long before PyPI.
      - name: Import smoke test (built wheel, nothing from the checkout)
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/pip" install --quiet dist/*.whl
          mkdir -p "${RUNNER_TEMP}/smoke-cwd"
          cd "${RUNNER_TEMP}/smoke-cwd"
          "${RUNNER_TEMP}/smoke/bin/python" "${GITHUB_WORKSPACE}/util/wheel_import_smoke.py"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # TestPyPI: Publish and verify install
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true

      - name: Verify TestPyPI install
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          sleep 30
          pip install --no-deps --index-url https://test.pypi.org/simple/ juniper-canopy==${VERSION}
          python -c "from juniper_canopy import __version__; print(f'TestPyPI OK: v{__version__}')"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # PyPI: Publish after TestPyPI verification
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
