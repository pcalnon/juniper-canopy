---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperCanopy
# Application:   juniper_canopy
# File Name:     ci.yml
# Author:        Paul Calnon
# Version:       0.13.0
#
# Date Created:  2025-11-03
# Last Modified: 2026-02-25
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI/CD Pipeline for Juniper Canopy CasCor NN Frontend
#    - Pre-commit hooks for code quality (black, isort, flake8, mypy, bandit)
#    - Unit tests with coverage enforcement
#    - Integration tests
#    - Security scanning (Gitleaks, Bandit SARIF, pip-audit)
#    - Proper failure handling (no continue-on-error for critical steps)
#    - Dependency caching for performance
#    - Migrated from conda to pip for CI portability (polyrepo Phase 5)
#
# References:
#    - CANOPY-P1-001: CI/CD Pipeline Setup
#    - Best practices: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#####################################################################################################################################################################################################

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main
      - develop
  repository_dispatch:
    types: [data-client-updated, cascor-client-updated]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENV_NAME: juniper-canopy
  PYTHON_TEST_VERSION: "3.14"
  COVERAGE_FAIL_UNDER: "80"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks (runs across multiple Python versions)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run pre-commit hooks
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Pre-commit Checks                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pre-commit run --all-files --show-diff-on-failure

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Unit Tests: Run unit tests with coverage enforcement
  # Migrated from conda to pip for CI portability (polyrepo Phase 5)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests + Coverage (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # METRICS-MON R3.7 / seed-(R1.3 design): macOS leg runs in
    # continue-on-error mode for the initial 2-week soak (started
    # 2026-04-30). The Linux legs remain required; the macOS leg
    # surfaces platform-divergence failures (POSIX-only assumptions
    # in the WS / dashboard / dataset paths) without blocking PRs
    # while we identify environment-specific issues. After the soak,
    # flip the include block's ``experimental`` flag to false to make
    # the macOS leg required.
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
            experimental: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║    Juniper Canopy - Install Dependencies                   ║"
          echo "║    Python ${{ matrix.python-version }} on ${{ matrix.os }} ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          # METRICS-MON R3.7: torch wheel resolution differs by OS.
          # Linux uses the CPU-only PyTorch index to avoid pulling CUDA
          # wheels; macOS finds its native wheels via the default PyPI
          # index — the CPU-only Linux index has no macOS-arm64 wheels.
          if [ "${{ runner.os }}" = "macOS" ]; then
            pip install torch
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          # Install all other CI dependencies
          pip install -r conf/requirements_ci.txt
          # Install project as editable so source-tree path resolution works
          pip install -e .
          # h5py is an OPTIONAL runtime dependency: the HDF5 snapshot routes in
          # src/main.py lazy-import it and soft-fail with a 500 "h5py not
          # available" guard when it is absent, so it is intentionally NOT a hard
          # project dependency (kept out of pyproject / the lockfile / the base
          # conf/requirements_ci.txt to keep the base install slim). The per-file
          # coverage gate below measures the whole src tree, so the coverage lane
          # installs h5py explicitly to exercise (and cover) the snapshot code
          # paths. Scoped to this job only — the integration / ui / build jobs do
          # not run the snapshot unit tests and keep the slim install.
          pip install "h5py>=3.0"

      # Preflight (test-suite audit §10.1): assert the juniper-* distributions
      # installed above (plain wheels included) satisfy canopy's pyproject.toml
      # floors AND that requirements.lock pins satisfy them (catches
      # lock-below-floor drift). Guards the 2026-06-26 incident class — a live
      # env that drifted below floors while CI stayed green. The shared checker
      # ships as the juniper-env-drift-check console script in
      # juniper-ci-tools>=0.5.1 (juniper-ml#579/#590). Runs inside this already
      # required job (see required-checks `needs`), so a failure blocks the PR.
      - name: Preflight - Environment Floor-Drift Check
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Environment Floor-Drift Check       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install "juniper-ci-tools>=0.6.0,<0.7.0"
          juniper-env-drift-check --repo-root . --check-lock

      - name: Create required directories
        run: |
          mkdir -p logs src/logs reports/junit reports/coverage reports/htmlcov

      - name: Run Unit Tests with Coverage Gate
        env:
          CASCOR_BACKEND_AVAILABLE: 0
          RUN_SERVER_TESTS: 0
          ENABLE_SLOW_TESTS: 0
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Unit Tests (Fast Only)              ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          set +e
          python -m pytest \
            -m "not requires_cascor and not requires_server and not slow" \
            src/tests/unit/ src/tests/regression/ \
            --verbose \
            --timeout=60 \
            --maxfail=5 \
            --junitxml=reports/junit/junit-unit.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=json:reports/coverage.json \
            --cov-report=html:reports/htmlcov \
            --cov-fail-under=${COVERAGE_FAIL_UNDER} \
            2>&1 | tee reports/junit/pytest-unit.log
          PYTEST_EXIT=${PIPESTATUS[0]}

          # Python 3.12 may SIGABRT (exit 134) during interpreter cleanup after
          # all tests pass. Check the JUnit XML for actual test results.
          if [ "$PYTEST_EXIT" -eq 134 ] && [ -f reports/junit/junit-unit.xml ]; then
            if grep -q 'failures="0"' reports/junit/junit-unit.xml && grep -q 'errors="0"' reports/junit/junit-unit.xml; then
              echo "::warning::pytest exited with SIGABRT (134) during cleanup but JUnit XML shows 0 failures/errors — treating as success (Python 3.12 runtime bug)"
              exit 0
            fi
          fi

          exit $PYTEST_EXIT

      # Per-file coverage rollout C-5 (juniper-ml
      # notes/JUNIPER_ECOSYSTEM_PER_FILE_COVERAGE_ROLLOUT_SCOPING_2026-06-30.md):
      # a BLOCKING per-file gate over the whole src tree measured by the unit
      # lane above. Exit 1 if any source file's statement coverage < 90% OR any
      # packaged sub-module's pooled (statement-weighted) coverage < 95%. The
      # shared juniper-coverage-gap-map computes statement % itself from
      # coverage.json, so this repo's ``branch = true`` coverage config does not
      # change the gate basis. Complements the aggregate ``--cov-fail-under=80``
      # gate above (which a single well-covered file can mask). ci-tools 0.6.0
      # is already installed by the preflight step; the pin here keeps the step
      # self-contained.
      - name: Enforce per-file coverage gate (blocking)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║   Juniper Canopy - Per-File Coverage Gate (>=90 file/>=95) ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pip install "juniper-ci-tools>=0.6.0,<0.7.0"
          juniper-coverage-gap-map --coverage-json reports/coverage.json --enforce

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            reports/coverage.xml
            reports/htmlcov/
          retention-days: 30

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        if: always()
        with:
          files: reports/coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: reports/junit/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Integration Tests: Run integration tests (PRs and main/develop pushes)
  # Migrated from conda to pip for CI portability (polyrepo Phase 5)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r conf/requirements_ci.txt
          pip install -e .

      - name: Create required directories
        run: |
          mkdir -p logs src/logs reports/junit

      - name: Run Integration Tests (Fast Only)
        env:
          CASCOR_BACKEND_AVAILABLE: 0
          RUN_SERVER_TESTS: 0
          ENABLE_SLOW_TESTS: 0
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Integration Tests (Fast Only)       ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m pytest \
            -m "integration and not requires_cascor and not requires_server and not slow" \
            src/tests/integration \
            --verbose \
            --timeout=120 \
            --maxfail=3 \
            --junitxml=reports/junit/junit-integration.xml

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: integration-test-results
          path: reports/junit/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # UI Tests: Playwright browser-automation sub-suite
  # FRONTEND_ISSUES_PLAN_2026-05-09.md §5 (Issue #4) / Resolution log Q3
  #   Budget commitment: must add ≤5 min to overall CI wall-clock. Runs in
  #   parallel with unit-tests so wall-clock cost is max(unit, ui) - unit.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  ui-tests:
    name: UI Sub-suite (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r conf/requirements_ci.txt
          pip install -e ".[ui-test]"

      - name: Install Playwright browser
        run: |
          playwright install --with-deps chromium

      - name: Create required directories
        run: |
          mkdir -p logs src/logs reports/junit

      - name: Run UI Tests
        env:
          JUNIPER_CANOPY_DEMO_MODE: "1"
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - UI Sub-suite (Playwright)           ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m pytest \
            -m "ui and not slow" \
            src/tests/ui \
            --verbose \
            --timeout=120 \
            --maxfail=3 \
            --junitxml=reports/junit/junit-ui.xml

      - name: Upload UI Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: ui-test-results
          path: reports/junit/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Build: Build distribution packages
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install build

      - name: Build distribution packages
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Build Distribution                  ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m build --sdist --wheel

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la dist/
          test -f dist/*.tar.gz || (echo "::error::Source distribution not found" && exit 1)
          test -f dist/*.whl || (echo "::error::Wheel not found" && exit 1)
          echo "Build artifacts verified successfully"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-packages
          path: dist/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Security: Run security scans (Gitleaks, Bandit, pip-audit)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: [pre-commit]

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secrets Detection)
        # Skip on repository_dispatch: gitleaks-action does not yet
        # support that event ("ERROR: The [repository_dispatch]
        # event is not yet supported"), so the action errors out
        # before any scanning happens. Other event types still scan.
        if: github.event_name != 'repository_dispatch'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2.3.9 ships as a Node.js 20 action.
          # GitHub forces Node 24 on 2026-06-02; opt in now to eliminate
          # the deprecation warning and ensure continued operation past
          # the cutover. Drop this once gitleaks-action publishes a
          # release pinned to node24 (upstream PR #215).
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        # gitleaks-action v2.3.9 has no `fail` input — passing it triggers
        # "Unexpected input(s) 'fail'" warnings in CI. The action exits
        # non-zero on leaks by default, which is the behavior we want.

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install bandit pip-audit

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run Bandit (SAST) -> SARIF
        id: bandit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Bandit Security Scan                ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          bandit -r src -f sarif -o reports/security/bandit.sarif -c .bandit.yml 2>&1 || BANDIT_EXIT=$?
          bandit -r src -f txt -o reports/security/bandit.txt -c .bandit.yml 2>&1 || true
          if [ "${BANDIT_EXIT:-0}" -ne 0 ]; then
            echo "::warning::Bandit found security issues. Review the SARIF report."
            echo "bandit_found_issues=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Bandit scan passed - no security issues found."
            echo "bandit_found_issues=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: reports/security/bandit.sarif
        continue-on-error: true

      - name: Run pip-audit (Dependency Vulnerabilities)
        id: pip_audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - pip-audit Dependency Scan           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pip install -e ".[juniper-data,juniper-cascor,observability]"
          pip freeze > reports/security/pip-freeze.txt
          pip-audit --output reports/security/pip-audit.txt 2>&1 || PIP_AUDIT_EXIT=$?
          if [ "${PIP_AUDIT_EXIT:-0}" -ne 0 ]; then
            echo "::error::pip-audit found vulnerabilities in dependencies!"
            echo "vulnerabilities_found=true" >> "$GITHUB_OUTPUT"
            cat reports/security/pip-audit.txt
            exit 1
          else
            echo "::notice::pip-audit passed - no known vulnerabilities found."
            echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Security Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: security-reports
          path: reports/security/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Dependency Documentation: Generate pip, conda, and other dependency records
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  dependency-docs:
    name: Dependency Documentation
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Set up Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5  # v4.0.1
        with:
          miniforge-version: latest
          auto-activate-base: true
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install project dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r conf/requirements_ci.txt
          pip install -e .

      # Wave 2 of the dep-docs PyPI migration -- replaces the inline
      # bash scripts/generate_dep_docs.sh with the juniper-ci-tools
      # console script from PyPI. See juniper-ml plan
      # notes/JUNIPER_CI_TOOLS_PYPI_MIGRATION_PLAN_2026-05-20.md.
      # The inline script will be removed in Wave 4.
      - name: Install juniper-ci-tools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.6.0,<0.7.0"

      - name: Generate Dependency Documentation
        shell: bash -l {0}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Dependency Documentation            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-generate-dep-docs

      - name: Upload Dependency Documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: dependency-docs
          path: |
            conf/requirements_ci.txt
            conf/requirements_ci_*.txt
            conf/conda_environment_ci.yaml
            conf/conda_environment_ci_*.yaml
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Lockfile Check: Verify requirements.lock matches pyproject.toml
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  lockfile-check:
    name: Lockfile Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Check lockfile freshness
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Lockfile Freshness Check            ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # Resolve pyproject.toml using the committed lockfile as constraints.
          # The check passes when the pinned versions still satisfy
          # pyproject.toml. It does NOT fail just because newer versions are
          # available on PyPI — that's the whole point of pinning. The check
          # fails only when pyproject.toml has drifted from what the lockfile
          # can support: a new dep was added, a min-version was bumped past a
          # pin, or an entry was removed. Refresh by running:
          #   uv pip compile pyproject.toml \
          #     --extra juniper-data --extra juniper-cascor --extra observability \
          #     --upgrade -o requirements.lock
          uv pip compile pyproject.toml \
            --extra juniper-data \
            --extra juniper-cascor \
            --extra observability \
            --constraint requirements.lock \
            -o /tmp/requirements.lock.check

          # Compare only the resolved pin lines (pkg==version), ignoring all
          # comments. uv's --constraint mode adds "# -c requirements.lock"
          # annotations and the autogenerated header embeds the -o path, both
          # of which would otherwise create false-positive diffs.
          grep '^[^[:space:]#]' requirements.lock | sort > /tmp/lock_pins
          grep '^[^[:space:]#]' /tmp/requirements.lock.check | sort > /tmp/check_pins

          if ! diff -u /tmp/lock_pins /tmp/check_pins; then
            echo ""
            echo "::error::requirements.lock no longer satisfies pyproject.toml — refresh with: uv pip compile pyproject.toml --extra juniper-data --extra juniper-cascor --extra observability --upgrade -o requirements.lock"
            exit 1
          fi

          echo "::notice::requirements.lock satisfies pyproject.toml ✓"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Documentation Links: Validate internal markdown links
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docs:
    name: Documentation Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"

      # Doc-link validator is installed from the published juniper-doc-tools
      # PyPI package. The inline scripts/check_doc_links.py copy was removed
      # in Wave 4 (PR #288, 2026-05-19); the PyPI install is now the only
      # path. Migration history:
      # juniper-ml notes/JUNIPER_DOC_TOOLS_PYPI_MIGRATION_PLAN_2026-05-18.md.
      - name: Install juniper-doc-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-doc-tools>=0.1.0,<0.2.0" "pyyaml>=6.0"

      - name: Validate Documentation Links
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Documentation Link Validation       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-check-doc-links \
            --exclude templates \
            --exclude history \
            --exclude legacy \
            --exclude pull_requests \
            --exclude releases \
            --exclude analysis \
            --exclude fixes \
            --exclude development \
            --exclude CHANGELOG.md \
            --cross-repo skip

      # Catches the failure class that broke 3 juniper-X CIs on
      # 2026-05-18: a workflow that invokes ``python|bash <path>`` after
      # the path was renamed or moved. Wave 4 of the dep-docs PyPI
      # migration (juniper-ml notes/JUNIPER_CI_TOOLS_PYPI_MIGRATION_PLAN_2026-05-20.md)
      # ships this lint as the ``juniper-lint-workflow-paths`` console
      # script in ``juniper-ci-tools>=0.2.0``; the inline byte-identical
      # copy at ``util/test_workflow_script_paths.py`` was deleted in
      # this PR. The shared tool discovers the repo root via a
      # ``.github/workflows/`` walk-up so it works out-of-the-box.
      - name: Install juniper-ci-tools (workflow-path + agents-md lints)
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.6.0,<0.7.0"

      - name: Lint .github/workflows/ script paths
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Workflow script-path lint                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-workflow-paths

      # Pins AGENTS.md's `**Version**:` header to pyproject.toml's
      # [project].version so version bumps stay in sync with the
      # agent-facing contract. Shipped as the
      # ``juniper-lint-agents-md-version`` console script in
      # ``juniper-ci-tools>=0.3.0`` (juniper-ml#310); the inline
      # byte-identical copy at ``util/test_agents_md_version_drift.py``
      # was deleted in this PR.
      - name: Lint AGENTS.md version vs pyproject.toml
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md version-drift lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-version

      # Pins AGENTS.md's header bullet block to the canonical six-field
      # schema (Project / Repository / Author / License / Version /
      # Last Updated, in that relative order). Currency of the
      # `**Last Updated**` field is maintained by the
      # `.github/workflows/agents-md-touch-up.yml` workflow (auto-bumps
      # on every PR push). Shipped as the
      # ``juniper-lint-agents-md-header`` console script in
      # ``juniper-ci-tools>=0.4.0`` (juniper-ml#319). Canopy adopts the
      # full schema in this PR (was on a minimal `**Version**:`-only
      # header until now).
      - name: Lint AGENTS.md header schema
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md header-schema lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-header

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Async-route audit (Phase 4 — enforced).
  # Catches the BUG-JD-10 bug class (sync-blocking calls inside async def
  # route handlers). Hard-fails on any new violation; this repo reached
  # zero visible violations at end of Phase 3 (PR #247). Per-file-ignores
  # live in pyproject.toml [tool.ruff.lint.per-file-ignores].
  # See juniper-ml notes/ASYNC_ROUTE_AUDIT_HOOK_MIGRATION_PLAN.md §4.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  async-route-audit:
    name: Async-route audit (BUG-JD-10 class)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install "ruff==0.15.6"

      - name: Run async-route audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Async-route audit (BUG-JD-10)       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          ruff check --select ASYNC --output-format=github src/

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Docker Build & Smoke Test: Verify Dockerfile builds and container starts
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Build Docker Image
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Docker Build                        ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          docker build -t juniper-canopy:ci-${{ github.sha }} .

      - name: Verify Container Starts
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Docker Smoke Test                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # SEC-F22 / D2 (PR #420 follow-up): the startup loopback bind-guard
          # (src/security.py -> enforce_loopback_bind_guard, run in main.lifespan)
          # refuses to serve on the container's internal non-loopback bind
          # (the Dockerfile sets JUNIPER_CANOPY_SERVER__HOST=0.0.0.0) unless the
          # operator attests a fronting authenticating proxy. This smoke test has
          # no such proxy and only needs the container to boot for the health
          # probe, so attest here (and ONLY in this ephemeral CI container).
          docker run -d --name juniper-canopy-test \
            -p 8050:8050 \
            -e JUNIPER_CANOPY_FRONTING_AUTH_ATTESTED=true \
            juniper-canopy:ci-${{ github.sha }}

          echo "Waiting for service to become healthy..."
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' juniper-canopy-test 2>/dev/null | grep -q healthy; then
              echo "Service is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Service did not become healthy within 30 attempts"
              docker logs juniper-canopy-test
              exit 1
            fi
            sleep 2
          done

      - name: Verify Package Import
        run: |
          docker exec juniper-canopy-test python -c "import juniper_canopy; print(juniper_canopy.__version__)"

      - name: Verify Health Endpoint
        run: |
          curl -sf http://localhost:8050/v1/health | python3 -m json.tool

      - name: Cleanup
        if: always()
        run: |
          docker stop juniper-canopy-test 2>/dev/null || true
          docker rm juniper-canopy-test 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Required Checks Aggregator: Final quality gate
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, unit-tests, integration-tests, ui-tests, security, build, dependency-docs, lockfile-check, docs, docker-build]

    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Quality Gate Status                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:        ${{ needs.pre-commit.result }}"
          echo "Unit Tests:        ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "UI Tests:          ${{ needs.ui-tests.result }}"
          echo "Security:          ${{ needs.security.result }}"
          echo "Build:             ${{ needs.build.result }}"
          echo "Dependency Docs:   ${{ needs.dependency-docs.result }}"
          echo "Documentation:     ${{ needs.docs.result }}"
          echo "Lockfile Check:    ${{ needs.lockfile-check.result }}"
          echo "Docker Build:      ${{ needs.docker-build.result }}"
          echo ""

          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "::error::Security scans failed"
            exit 1
          fi

          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "::error::Integration tests failed"
            exit 1
          fi

          # UI tests: failure = error, skipped = OK (only runs on PRs and main/develop)
          if [[ "${{ needs.ui-tests.result }}" == "failure" ]]; then
            echo "::error::UI sub-suite (Playwright) failed"
            exit 1
          fi

          # Dependency docs: failure = error, skipped = OK (non-blocking)
          if [[ "${{ needs.dependency-docs.result }}" == "failure" ]]; then
            echo "::error::Dependency documentation generation failed"
            exit 1
          fi

          # Documentation links: failure = error
          if [[ "${{ needs.docs.result }}" == "failure" ]]; then
            echo "::error::Documentation link validation failed"
            exit 1
          fi

          # Lockfile must be fresh (stale lockfile = Docker builds don't match CI)
          if [[ "${{ needs.lockfile-check.result }}" != "success" ]]; then
            echo "::error::Lockfile freshness check failed — requirements.lock is stale"
            exit 1
          fi

          # Docker build: failure = error, skipped = OK (only runs on PRs and main/develop)
          if [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "::error::Docker build and smoke test failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED ✓"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Notify: Build status notification
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [required-checks]
    if: always()

    steps:
      - name: Build Status Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Build Complete                      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "========== CI/CD Pipeline Summary =============================="
          echo "Status:   ${{ needs.required-checks.result }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Actor:    ${{ github.actor }}"
          echo "Event:    ${{ github.event_name }}"
          echo "================================================================"
