---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperCanopy
# Application:   juniper_canopy
# File Name:     ci.yml
# Author:        Paul Calnon
# Version:       0.13.0
#
# Date Created:  2025-11-03
# Last Modified: 2026-02-25
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI/CD Pipeline for Juniper Canopy CasCor NN Frontend
#    - Pre-commit hooks for code quality (black, isort, flake8, mypy, bandit)
#    - Unit tests with coverage enforcement
#    - Integration tests
#    - Security scanning (Gitleaks, Bandit SARIF, pip-audit)
#    - Proper failure handling (no continue-on-error for critical steps)
#    - Dependency caching for performance
#    - Migrated from conda to pip for CI portability (polyrepo Phase 5)
#
# References:
#    - CANOPY-P1-001: CI/CD Pipeline Setup
#    - Best practices: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#####################################################################################################################################################################################################

name: CI/CD Pipeline

on:
  push:
    # Topic-branch globs (feature/**, fix/**) removed 2026-08-13: once a PR is open,
    # `push` and `pull_request` BOTH fire for the same commit, so every job ran twice.
    # The concurrency group is keyed on github.ref, which differs between a branch push
    # (refs/heads/...) and a PR (refs/pull/N/merge), so cancel-in-progress never
    # collapsed the pair. canopy has the fleet's longest suite (~10 min incl. the
    # Playwright UI sub-suite and four Unit Tests + Coverage legs), so the duplicate was
    # the most expensive in the ecosystem. Same fix as juniper-recurrence#108 and
    # juniper-ml#1076. `pull_request` covers every commit once a PR exists;
    # workflow_dispatch remains for a branch with no PR.
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  repository_dispatch:
    types: [data-client-updated, cascor-client-updated]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENV_NAME: juniper-canopy
  PYTHON_TEST_VERSION: "3.14"
  COVERAGE_FAIL_UNDER: "80"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks (runs across multiple Python versions)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run pre-commit hooks
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Pre-commit Checks                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pre-commit run --all-files --show-diff-on-failure

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Unit Tests: Run unit tests with coverage enforcement
  # Migrated from conda to pip for CI portability (polyrepo Phase 5)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests + Coverage (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The macOS leg is REQUIRED, like the Linux 3.12, 3.13 and 3.14 legs. METRICS-MON R3.7 /
    # seed-(R1.3 design) added it as a continue-on-error soak (started 2026-04-30), and
    # juniper-canopy#211 ended the soak on 2026-05-01 by setting the include block's
    # ``experimental`` flag to false, so a failing macOS leg fails the job. Ruleset 14249530
    # requires "Unit Tests + Coverage (Python 3.12 on macos-latest)" with the three Linux contexts
    # (read 2026-11-15). The leg surfaces platform-divergence failures (POSIX-only assumptions in
    # the WS / dashboard / dataset paths).
    #
    # The Python 3.15 leg is INFORMATIONAL: phase 1 of the ecosystem's 3.15 migration (Overtoad request,
    # 2026-11-14) runs it so its results show, but it must block no merge. It is the only leg with
    # ``experimental: true``, so this expression is true on it alone: a failure there leaves the
    # job's result, which the Quality Gate reads as `needs.unit-tests.result`, unchanged, and the
    # jobs that `needs: [unit-tests]` (integration-tests, build) still run. Measured on
    # juniper-data#538 (run 43655144734), where the gate printed "Unit Tests: success" with the 3.15
    # leg failed on purpose. Its context is in no ruleset. Keep this expression and the leg's include
    # entry until the Overtoad makes 3.15 a required version (phase 3 of the migration).
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
            experimental: false
          # Informational, never required: see the comment above `continue-on-error`.
          - os: ubuntu-latest
            python-version: "3.15"
            experimental: true

    steps:
      - name: Checkout Code
        id: checkout-code
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        id: set-up-python
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the HDF5 headers h5py builds against (Python 3.15 only)
        # Phase 2 of the ecosystem's Python 3.15 migration. h5py publishes no CPython 3.15 wheel
        # (3.16.0, 2026-03-06, the newest release, ships cp310-cp314), so on the 3.15 leg pip builds
        # it from the sdist, and that build needs libhdf5's headers and pkg-config, which the runner
        # image lacks. Without them `Install dependencies` fails at
        # `pip install "h5py>=3.0"`, and the snapshot tests that need h5py then fail.
        # The blocking legs install h5py's wheel and skip this step. Drop it once h5py ships a cp315
        # wheel.
        id: install-the-hdf5-headers-h5py-builds-against
        if: matrix.experimental == true && runner.os == 'Linux'
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhdf5-dev pkg-config

      - name: Install dependencies
        id: install-dependencies
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║    Juniper Canopy - Install Dependencies                   ║"
          echo "║    Python ${{ matrix.python-version }} on ${{ matrix.os }} ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          # METRICS-MON R3.7: torch wheel resolution differs by OS.
          # Linux uses the CPU-only PyTorch index to avoid pulling CUDA
          # wheels; macOS finds its native wheels via the default PyPI
          # index — the CPU-only Linux index has no macOS-arm64 wheels.
          if [ "${{ runner.os }}" = "macOS" ]; then
            pip install torch
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          # conf/requirements_ci.txt is NOT installed here. It is generator output
          # (juniper-generate-dep-docs) -- a pip freeze in which most lines are transitives
          # declared as direct -- so installing it pulled packages no lane uses and coupled this
          # job to their version conflicts (juniper-ml#1994). The declared surface lives in
          # pyproject extras, which is what the security job and every sibling repo install.
          # Install project as editable so source-tree path resolution works.
          # CL2 (juniper-ml training-runtime defects plan §7/§13): install the
          # [juniper-cascor] extra so the REAL juniper-cascor-client (>=0.7.0) is
          # present in this required lane. Without it src/tests/conftest.py injects
          # a stub and src/tests/unit/backend/test_stream_liveness.py (the 510-line
          # N2 stream-liveness + CL2 seam suite) silently importorskips — it had
          # only ever run in client-equipped local envs. With the extra the suite
          # executes here, and the floor-drift preflight + coverage gate below both
          # exercise the real cascor-client seam path.
          pip install -e ".[test,juniper-cascor,observability]"
          # h5py is an OPTIONAL runtime dependency: the HDF5 snapshot routes in
          # src/main.py lazy-import it and soft-fail with a 500 "h5py not
          # available" guard when it is absent, so it is intentionally NOT a hard
          # project dependency (kept out of pyproject / the lockfile / the base
          # conf/requirements_ci.txt to keep the base install slim). The per-file
          # coverage gate below measures the whole src tree, so the coverage lane
          # installs h5py explicitly to exercise (and cover) the snapshot code
          # paths. Scoped to this job only — the integration / ui / build jobs do
          # not run the snapshot unit tests and keep the slim install.
          pip install "h5py>=3.0"

      # Preflight (test-suite audit §10.1): assert the juniper-* distributions
      # installed above (plain wheels included) satisfy canopy's pyproject.toml
      # floors AND that requirements.lock pins satisfy them (catches
      # lock-below-floor drift). Guards the 2026-06-26 incident class — a live
      # env that drifted below floors while CI stayed green. The shared checker
      # ships as the juniper-env-drift-check console script in
      # juniper-ci-tools>=0.5.1 (juniper-ml#579/#590). Runs inside this already
      # required job (see required-checks `needs`), so a failure blocks the PR.
      - name: Preflight - Environment Floor-Drift Check
        id: preflight-environment-floor-drift-check
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Environment Floor-Drift Check       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install "juniper-ci-tools>=0.9.0,<0.10.0"
          juniper-env-drift-check --repo-root . --check-lock

      - name: Create required directories
        id: create-required-directories
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          mkdir -p logs src/logs reports/junit reports/coverage reports/htmlcov

      - name: Run Unit Tests with Coverage Gate
        id: run-unit-tests-with-coverage-gate
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          CASCOR_BACKEND_AVAILABLE: 0
          RUN_SERVER_TESTS: 0
          ENABLE_SLOW_TESTS: 0
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Unit Tests (Fast Only)              ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          set +e
          # contract/ and performance/ are listed here because they were listed NOWHERE.
          # The three pytest invocations in this file named unit/, regression/, integration
          # and ui; the scheduled lane's `-m "slow or integration"` selector deselects both
          # directories' tests (contract/ is all @pytest.mark.unit, performance/ is
          # unmarked). So:
          #   contract/    — test_param_map_completeness.py, which pins that every
          #                  Apply-button input has a param-map entry (the N5 silent-drop
          #                  class), had never executed in CI. Its only trace was a
          #                  collection error in the scheduled lane, so repairing that lane
          #                  would have removed the last sign it existed.
          #   performance/ — test_button_responsiveness.py: 5 tests, 1 explicitly skipped,
          #                  the other 4 live and never run anywhere.
          # Both directories pass under this lane's selector today (3 and 4 tests). The
          # selector is negative, so unmarked tests are selected rather than dropped.
          # test_ci_lane_wiring.py keeps any future directory from going unwired.
          python -m pytest \
            -m "not requires_cascor and not requires_server and not slow" \
            src/tests/unit/ src/tests/regression/ src/tests/contract/ src/tests/performance/ \
            --verbose \
            --timeout=60 \
            --maxfail=5 \
            --junitxml=reports/junit/junit-unit.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=json:reports/coverage.json \
            --cov-report=html:reports/htmlcov \
            --cov-fail-under=${COVERAGE_FAIL_UNDER} \
            2>&1 | tee reports/junit/pytest-unit.log
          PYTEST_EXIT=${PIPESTATUS[0]}

          # Python 3.12 may SIGABRT (exit 134) during interpreter cleanup after
          # all tests pass. Check the JUnit XML for actual test results.
          if [ "$PYTEST_EXIT" -eq 134 ] && [ -f reports/junit/junit-unit.xml ]; then
            if grep -q 'failures="0"' reports/junit/junit-unit.xml && grep -q 'errors="0"' reports/junit/junit-unit.xml; then
              echo "::warning::pytest exited with SIGABRT (134) during cleanup but JUnit XML shows 0 failures/errors — treating as success (Python 3.12 runtime bug)"
              exit 0
            fi
          fi

          exit $PYTEST_EXIT

      # Per-file coverage rollout C-5 (juniper-ml
      # notes/JUNIPER_ECOSYSTEM_PER_FILE_COVERAGE_ROLLOUT_SCOPING_2026-06-30.md):
      # a BLOCKING per-file gate over the whole src tree measured by the unit
      # lane above. Exit 1 if any source file's statement coverage < 90% OR any
      # packaged sub-module's pooled (statement-weighted) coverage < 95%. The
      # shared juniper-coverage-gap-map computes statement % itself from
      # coverage.json, so this repo's ``branch = true`` coverage config does not
      # change the gate basis. Complements the aggregate ``--cov-fail-under=80``
      # gate above (which a single well-covered file can mask). juniper-ci-tools
      # (>=0.9.0,<0.10.0) is already installed by the preflight step; the pin here
      # keeps the step self-contained.
      - name: Enforce per-file coverage gate (blocking)
        id: enforce-per-file-coverage-gate-blocking
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║   Juniper Canopy - Per-File Coverage Gate (>=90 file/>=95) ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"
          juniper-coverage-gap-map --coverage-json reports/coverage.json --enforce

      - name: Upload Coverage Artifacts
        id: upload-coverage-artifacts
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            reports/coverage.xml
            reports/htmlcov/
          retention-days: 30

      # CODECOV_TOKEN is an Actions repository secret (Overtoad ruling, 2026-10-29). Without it the
      # uploads were refused -- "Token required - not valid tokenless upload" -- inside this step,
      # which stays green because fail_ci_if_error is false. A Dependabot PR reads the Dependabot
      # secret store, which has held the token too since 2026-11-04, so its upload carries it.
      - name: Upload Coverage to Codecov
        id: upload-coverage-to-codecov
        continue-on-error: ${{ matrix.experimental == true }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload Test Results
        id: upload-test-results
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: reports/junit/
          retention-days: 30

      - name: Report the informational Python 3.15 result
        # Python 3.15 is INFORMATIONAL (phase 1 of the 3.15 migration). On the 3.15 leg every step above
        # carries `continue-on-error: ${{ matrix.experimental == true }}`, so a failing step neither stops
        # this job nor turns its check red, and no merge, push or deployment waits on it. This step says
        # what failed instead: a warning annotation, and a table in the job summary.
        if: always() && matrix.experimental == true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          PY_LEG: ${{ matrix.python-version }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["STEPS_JSON"])
          leg = os.environ["PY_LEG"]
          failed = [k for k, v in steps.items() if v.get("outcome") not in ("success", "skipped")]
          rows = "\n".join(f"| `{k}` | {v.get('outcome')} |" for k, v in steps.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### Python {leg}: informational, blocks nothing\n\n| Step | Outcome |\n|---|---|\n{rows}\n")
          if failed:
              print(f"::warning title=Python {leg} (informational)::{len(failed)} step(s) failed on Python {leg}: {', '.join(failed)}. Nothing is blocked; see this job's summary.")
          else:
              print(f"::notice title=Python {leg} (informational)::every step passed on Python {leg}")
          PY

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Integration Tests: Run integration tests (PRs and main/develop pushes)
  # Migrated from conda to pip for CI portability (polyrepo Phase 5)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # N3: the adapter now imports juniper_cascor_client.constants at
          # module level (ENDPOINT_TRAINING_START for the start_fresh POST),
          # so the integration lane needs the real >=0.7.0 client — the same
          # [juniper-cascor] extra CL2 (#453) added to the unit lane. Without
          # it this env resolved an ancient client and the adapter import
          # (hence three integration modules) failed to collect.
          pip install -e ".[test,juniper-cascor,observability]"

      - name: Create required directories
        run: |
          mkdir -p logs src/logs reports/junit

      - name: Run Integration Tests (Fast Only)
        env:
          CASCOR_BACKEND_AVAILABLE: 0
          RUN_SERVER_TESTS: 0
          ENABLE_SLOW_TESTS: 0
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Integration Tests (Fast Only)       ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m pytest \
            -m "integration and not requires_cascor and not requires_server and not slow" \
            src/tests/integration \
            --verbose \
            --timeout=120 \
            --maxfail=3 \
            --junitxml=reports/junit/junit-integration.xml

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: integration-test-results
          path: reports/junit/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # UI Tests: Playwright browser-automation sub-suite
  # FRONTEND_ISSUES_PLAN_2026-05-09.md §5 (Issue #4) / Resolution log Q3
  #   Budget commitment: must add ≤5 min to overall CI wall-clock. Runs in
  #   parallel with unit-tests so wall-clock cost is max(unit, ui) - unit.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  ui-tests:
    name: UI Sub-suite (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,ui-test,observability]"

      - name: Install Playwright browser
        run: |
          playwright install --with-deps chromium

      - name: Create required directories
        run: |
          mkdir -p logs src/logs reports/junit

      - name: Run UI Tests
        env:
          JUNIPER_CANOPY_DEMO_MODE: "1"
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - UI Sub-suite (Playwright)           ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          python -m pytest \
            -m "ui and not slow" \
            src/tests/ui \
            --verbose \
            --timeout=120 \
            --maxfail=3 \
            --junitxml=reports/junit/junit-ui.xml

      - name: Upload UI Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ui-test-results
          path: reports/junit/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Build: Build distribution packages
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install build

      - name: Build distribution packages
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Build Distribution                  ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m build --sdist --wheel

      - name: Verify build artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la dist/
          test -f dist/*.tar.gz || (echo "::error::Source distribution not found" && exit 1)
          test -f dist/*.whl || (echo "::error::Wheel not found" && exit 1)
          echo "Build artifacts verified successfully"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-packages
          path: dist/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Security: Run security scans (Gitleaks, Bandit, pip-audit)
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: [pre-commit]

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secrets Detection)
        # Skip on repository_dispatch: gitleaks-action (v2.3.9, and v3.0.0 at
        # the pinned SHA) does not support that event ("ERROR: The
        # [repository_dispatch] event is not yet supported"), so the action
        # errors out before any scanning happens.
        # A pull request is scanned by the two steps after this one instead:
        # the action's own pull_request path never reaches past the pull
        # request's 30th commit, and at any length its --first-parent walk
        # drops what a merge brought in (see "Run Gitleaks over the pull
        # request"). `push` and `workflow_dispatch` still run the action.
        if: github.event_name != 'repository_dispatch' && github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v3.0.0's action.yml already declares `using: "node24"`, so this
          # opt-in (added for v2.3.9's Node 20) no longer changes anything.
          # It stays, so that this change leaves the action's environment
          # as it was.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
          # The engine version, stated rather than inherited: gitleaks-action
          # v3.0.0 defaults to this same 8.24.3 (src/index.js at the pinned
          # SHA; this job's log named it on pull request #820), but a bump of
          # the action SHA would change it silently, and split the engine
          # between pushes and pull requests.
          # src/tests/regression/test_gitleaks_config.py pins it, and
          # src/tests/regression/test_gitleaks_pr_scan.py pins it together
          # with the pull-request install below.
          GITLEAKS_VERSION: "8.24.3"
        # The action declares no inputs (action.yml at the pinned SHA), so
        # there is no `fail:` to pass; it exits non-zero on a leak by itself.
        #
        # What it scans (src/index.js / src/gitleaks.js at the pinned SHA):
        # `push` scans `--no-merges --first-parent <first>^..<last>` across the
        # push payload's commits (`-1` when it holds one); `workflow_dispatch`
        # passes no --log-opts, so it scans EVERY commit reachable from every
        # branch and tag of this fetch-depth-0 checkout.
        # .gitleaks.toml and .gitleaksignore are auto-discovered at the repo
        # root. Until 2026-10-25 .gitleaks.toml had no `[extend]` table, so
        # this step ran with ZERO rules and could not fail.

      - name: Install Gitleaks (pull request)
        # The same engine the action installs, fetched by version and checked
        # against the release's published SHA-256 (the linux_x64 line of
        # gitleaks_8.24.3_checksums.txt) before anything runs it. A bump moves
        # GITLEAKS_VERSION here and on the action step, and this digest,
        # together: src/tests/regression/test_gitleaks_pr_scan.py pins all
        # three. On PATH it is also the binary the Gitleaks self-test runs on
        # a pull request.
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          if [ "${RUNNER_OS}/${RUNNER_ARCH}" != "Linux/X64" ]; then
            echo "::error title=Gitleaks::the pinned digest is for linux_x64, and this runner is ${RUNNER_OS}/${RUNNER_ARCH}"
            exit 1
          fi
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dest="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 120 \
            --output "${RUNNER_TEMP}/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum --check --strict
          mkdir -p "${dest}"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${dest}" gitleaks
          echo "${dest}" >> "${GITHUB_PATH}"
          "${dest}/gitleaks" version

      - name: Run Gitleaks over the pull request (Secrets Detection)
        # gitleaks-action v3.0.0 lists a pull request's commits with ONE
        # unpaginated call, GET /repos/{Overtoad}/{repo}/pulls/{n}/commits (30
        # per page by default, oldest first), and scans
        # `--no-merges --first-parent <first>^..<last>` across that page
        # (src/gitleaks.js at the pinned SHA). Commit 31 onwards is never
        # scanned, and because the walk starts from the page's last commit,
        # --first-parent drops every commit a merge brought into the branch
        # on a pull request of any length. Here, on #634 (7 commits, 2 of
        # them merges) it logged "4 commits scanned." and never reached
        # ec676ae6, one of the pull request's own 5 non-merge commits; on
        # juniper-ml#1797 (88 commits) it scanned 12, and 11 of those were
        # already on main. This step scans every commit in base..head from
        # the event payload instead, with the action's detect flags (not its
        # --no-merges --first-parent), the same auto-discovered .gitleaks.toml
        # and .gitleaksignore (both described on the action step), and the
        # action's outcomes: a leak fails the step with 1, any other gitleaks
        # failure with its own code.
        # --remerge-diff (git 2.36 or later) gives each two-parent merge
        # commit in the range a patch of what it changed beyond a plain
        # re-merge of its parents, such as a conflict resolution, which
        # `git log -p` alone prints for no merge commit; a clean merge prints
        # nothing. git prints no such patch for an octopus merge (`diff:
        # warning: Skipping remerge-diff for octopus merges.`), so the step
        # refuses a range that holds one.
        # The engine runs git through a filter that deletes the notes
        # --remerge-diff writes into a merge's file headers (`remerge
        # CONFLICT ...`, `remerge warning: ...`). gitleaks 8.24.3 parses the
        # log with go-gitdiff v0.9.1, which ends a file header at a line it
        # does not know and re-reads any preamble holding the word "commit"
        # as a commit header. With the notes left in, a finding in the
        # conflicted file was named b/<path>, and a note naming
        # .pre-commit-config.yaml (this repository has one), or quoting a
        # parent subject such as "pre-commit autoupdate", dropped the merge's
        # SHA from that finding and every later one in the merge: their
        # fingerprints were then file-scoped, and no .gitleaksignore entry
        # could match them. In `git log -p` output no patch line and no
        # commit-message line starts with "remerge ", so the filter deletes
        # nothing the engine scans (8.24.3 runs git only for log -p and
        # ls-remote --get-url; the filter edits every call's stdout, so an
        # engine bump re-checks that list). It passes git's stderr through
        # and, with pipefail, git's exit status: gitleaks fails on any git log
        # stderr line, and reads the exit status of `git ls-remote --get-url`
        # to tell a missing remote from a failure.
        # fetch-depth: 0 above is what puts both SHAs in the checkout.
        # The shell below is juniper-data's (juniper-data#530), unchanged;
        # src/tests/regression/test_gitleaks_pr_scan.py runs it against the
        # real engine.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
            if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error title=Gitleaks::'${sha}' is not a commit in this checkout, so the pull request cannot be scanned"
              exit 1
            fi
          done
          range="${BASE_SHA}..${HEAD_SHA}"
          count="$(git rev-list --count "${range}")"
          echo "Scanning ${count} commit(s) in ${range}; the pull request reports ${PR_COMMITS}."
          if [ "${count}" != "${PR_COMMITS}" ]; then
            echo "::warning title=Gitleaks::${range} holds ${count} commit(s), and the pull request reports ${PR_COMMITS}"
          fi
          octopus="$(git rev-list --count --min-parents=3 "${range}")"
          if [ "${octopus}" != "0" ]; then
            echo "::error title=Gitleaks::${range} holds ${octopus} octopus merge(s): --remerge-diff prints no patch for a merge of three or more parents, so what it changed itself cannot be scanned; replace it with two-parent merges"
            exit 1
          fi
          real_git="$(command -v git)"
          filter="${RUNNER_TEMP:?}/gitleaks-git-filter"
          mkdir -p "${filter}"
          cat > "${filter}/git" <<'FILTER'
          #!/usr/bin/env bash
          set -o pipefail
          "${REAL_GIT:?}" "$@" | LC_ALL=C sed -e '/^remerge /d'
          FILTER
          chmod +x "${filter}/git"
          mkdir -p reports/security
          rc=0
          REAL_GIT="${real_git}" PATH="${filter}:${PATH}" gitleaks detect --redact -v --exit-code=2 --report-format=sarif --report-path=reports/security/gitleaks.sarif --log-level=debug "--log-opts=--remerge-diff ${range}" || rc=$?
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '### Gitleaks\n\n%s commit(s) scanned in %s; gitleaks exited %s.\n' "${count}" "${range}" "${rc}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          case "${rc}" in
            0) ;;
            2)
              echo "::error title=Gitleaks::leaks detected in ${range}; the redacted findings are in this log and in reports/security/gitleaks.sarif"
              exit 1
              ;;
            *)
              echo "::error title=Gitleaks::gitleaks exited ${rc}, which is not a scan result"
              exit "${rc}"
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"
          cache: pip

      - name: Install security tools
        # bandit[sarif], not bare bandit: the SARIF formatter ships in that extra. Bare bandit
        # answered "-f sarif" with "invalid choice: 'sarif'", wrote no report, the step below
        # warned "Bandit found security issues" for an argument error, and the upload's
        # continue-on-error hid "Path does not exist" (found 2026-10-29, main run 40942351409).
        # security-scan.yml and every sibling repo's ci.yml already install the extra.
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "bandit[sarif]" pip-audit

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run Bandit (SAST) -> SARIF
        id: bandit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Bandit Security Scan                ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          bandit -r src -f sarif -o reports/security/bandit.sarif -c .bandit.yml 2>&1 || BANDIT_EXIT=$?
          bandit -r src -f txt -o reports/security/bandit.txt -c .bandit.yml 2>&1 || true
          if [ "${BANDIT_EXIT:-0}" -ne 0 ]; then
            echo "::warning::Bandit found security issues. Review the SARIF report."
            echo "bandit_found_issues=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Bandit scan passed - no security issues found."
            echo "bandit_found_issues=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always()
        with:
          sarif_file: reports/security/bandit.sarif
        # No ruleset here requires the `Bandit` check that code scanning creates from this upload, so a
        # failed upload used to be silent: juniper-canopy#780 found this step uploading nothing while
        # Security Scans stayed green. Security Scans is required, so on a PR a failed upload now turns
        # it red with the cause in this step's log. Every other event still tolerates it.
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Run pip-audit (Dependency Vulnerabilities)
        id: pip_audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - pip-audit Dependency Scan           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          pip install -e ".[juniper-data,juniper-cascor,observability]"
          pip freeze > reports/security/pip-freeze.txt
          pip-audit --output reports/security/pip-audit.txt 2>&1 || PIP_AUDIT_EXIT=$?
          if [ "${PIP_AUDIT_EXIT:-0}" -ne 0 ]; then
            echo "::error::pip-audit found vulnerabilities in dependencies!"
            echo "vulnerabilities_found=true" >> "$GITHUB_OUTPUT"
            cat reports/security/pip-audit.txt
            exit 1
          else
            echo "::notice::pip-audit passed - no known vulnerabilities found."
            echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gitleaks config and pull-request scan self-test (real engine)
        # The unit-test lane runs both files too (its `-m "not requires_cascor
        # and not requires_server and not slow"` over src/tests/regression/
        # selects them), but with no gitleaks binary their real-engine cases
        # skip. Here the binary is on PATH (the action put it there, or on a
        # pull request the Install Gitleaks step did), and
        # GITLEAKS_PARITY_REQUIRED turns a missing binary into a failure
        # instead of a skip, because a check that could not run is not a pass:
        # the built-in ruleset must fire on a fabricated token through the
        # auto-discovered .gitleaks.toml (the config is not vacuous), and,
        # with the ruleset this repository's scan loads (each pull-request
        # case's scratch repository carries this repository's .gitleaks.toml
        # and .gitleaksignore), the pull-request scan step's own shell must
        # find a token in the 35th commit of a 35-commit range, one a merge
        # brought in, and one that a merge commit itself added. It skips
        # repository_dispatch, the one event on which neither path puts a
        # binary on PATH (the action skips it, and it is not a pull request).
        # Both modules need only pytest and PyYAML and no conftest fixture,
        # so --noconftest keeps this job free of the test extra (and its
        # torch install); -o addopts= drops --strict-config, and -W silences
        # the config warnings for the ini keys (timeout, timeout_method,
        # asyncio_mode) whose plugins are not installed here.
        # Installed after pip-audit so they do not join its audit set.
        if: github.event_name != 'repository_dispatch'
        env:
          GITLEAKS_PARITY_REQUIRED: "1"
        run: |
          pip install pytest pyyaml
          python -m pytest --noconftest -p no:cacheprovider -o addopts="" -W "ignore::pytest.PytestConfigWarning" src/tests/regression/test_gitleaks_config.py src/tests/regression/test_gitleaks_pr_scan.py -v

      - name: Upload Security Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: security-reports
          path: reports/security/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Dependency Documentation: Generate pip, conda, and other dependency records
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  dependency-docs:
    name: Dependency Documentation
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Set up Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          miniforge-version: latest
          auto-activate-base: true
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install project dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,juniper-data,juniper-cascor,observability]"

      # Wave 2 of the dep-docs PyPI migration -- replaces the inline
      # bash scripts/generate_dep_docs.sh with the juniper-ci-tools
      # console script from PyPI. See juniper-ml plan
      # notes/JUNIPER_CI_TOOLS_PYPI_MIGRATION_PLAN_2026-05-20.md.
      # The inline script will be removed in Wave 4.
      - name: Install juniper-ci-tools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"

      - name: Generate Dependency Documentation
        shell: bash -l {0}
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Dependency Documentation            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-generate-dep-docs

      - name: Upload Dependency Documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: dependency-docs
          path: |
            conf/requirements_ci.txt
            conf/requirements_ci_*.txt
            conf/conda_environment_ci.yaml
            conf/conda_environment_ci_*.yaml
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Lockfile Check: Verify requirements.lock matches pyproject.toml
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  lockfile-check:
    name: Lockfile Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Check lockfile freshness
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Lockfile Freshness Check            ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # Resolve pyproject.toml using the committed lockfile as constraints.
          # The check passes when the pinned versions still satisfy
          # pyproject.toml. It does NOT fail just because newer versions are
          # available on PyPI — that's the whole point of pinning. The check
          # fails only when pyproject.toml has drifted from what the lockfile
          # can support: a new dep was added, a min-version was bumped past a
          # pin, or an entry was removed. Refresh by running:
          #   uv pip compile pyproject.toml \
          #     --extra juniper-data --extra juniper-cascor --extra observability \
          #     --upgrade -o requirements.lock
          uv pip compile pyproject.toml \
            --extra juniper-data \
            --extra juniper-cascor \
            --extra observability \
            --constraint requirements.lock \
            -o /tmp/requirements.lock.check

          # Compare only the resolved pin lines (pkg==version), ignoring all
          # comments. uv's --constraint mode adds "# -c requirements.lock"
          # annotations and the autogenerated header embeds the -o path, both
          # of which would otherwise create false-positive diffs.
          grep '^[^[:space:]#]' requirements.lock | sort > /tmp/lock_pins
          grep '^[^[:space:]#]' /tmp/requirements.lock.check | sort > /tmp/check_pins

          if ! diff -u /tmp/lock_pins /tmp/check_pins; then
            echo ""
            echo "::error::requirements.lock no longer satisfies pyproject.toml — refresh with: uv pip compile pyproject.toml --extra juniper-data --extra juniper-cascor --extra observability --upgrade -o requirements.lock"
            exit 1
          fi

          echo "::notice::requirements.lock satisfies pyproject.toml ✓"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Documentation Links: Validate internal markdown links
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docs:
    name: Documentation Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # python-version: ["3.12", "3.13", "3.14"]
          python-version: "3.14"

      # Doc-link validator is installed from the published juniper-doc-tools
      # PyPI package. The inline scripts/check_doc_links.py copy was removed
      # in Wave 4 (PR #288, 2026-05-19); the PyPI install is now the only
      # path. Migration history:
      # juniper-ml notes/JUNIPER_DOC_TOOLS_PYPI_MIGRATION_PLAN_2026-05-18.md.
      - name: Install juniper-doc-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-doc-tools>=0.1.0,<0.2.0" "pyyaml>=6.0"

      - name: Validate Documentation Links
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Documentation Link Validation       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-check-doc-links \
            --exclude templates \
            --exclude history \
            --exclude legacy \
            --exclude pull_requests \
            --exclude releases \
            --exclude analysis \
            --exclude fixes \
            --exclude development \
            --exclude CHANGELOG.md \
            --exclude tmp \
            --cross-repo skip

      # Catches the failure class that broke 3 juniper-X CIs on
      # 2026-05-18: a workflow that invokes ``python|bash <path>`` after
      # the path was renamed or moved. Wave 4 of the dep-docs PyPI
      # migration (juniper-ml notes/JUNIPER_CI_TOOLS_PYPI_MIGRATION_PLAN_2026-05-20.md)
      # ships this lint as the ``juniper-lint-workflow-paths`` console
      # script in ``juniper-ci-tools>=0.2.0``; the inline byte-identical
      # copy at ``util/test_workflow_script_paths.py`` was deleted in
      # this PR. The shared tool discovers the repo root via a
      # ``.github/workflows/`` walk-up so it works out-of-the-box.
      - name: Install juniper-ci-tools (workflow-path + agents-md lints)
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.9.0,<0.10.0"

      - name: Lint .github/workflows/ script paths
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Workflow script-path lint                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-workflow-paths

      # Pins AGENTS.md's `**Version**:` header to pyproject.toml's
      # [project].version so version bumps stay in sync with the
      # agent-facing contract. Shipped as the
      # ``juniper-lint-agents-md-version`` console script in
      # ``juniper-ci-tools>=0.3.0`` (juniper-ml#310); the inline
      # byte-identical copy at ``util/test_agents_md_version_drift.py``
      # was deleted in this PR.
      - name: Lint AGENTS.md version vs pyproject.toml
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md version-drift lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-version

      # Pins AGENTS.md's header bullet block to the canonical six-field
      # schema (Project / Repository / Author / License / Version /
      # Last Updated, in that relative order). Currency of the
      # `**Last Updated**` field is maintained by the
      # `.github/workflows/agents-md-touch-up.yml` workflow (auto-bumps
      # on every PR push). Shipped as the
      # ``juniper-lint-agents-md-header`` console script in
      # ``juniper-ci-tools>=0.4.0`` (juniper-ml#319). Canopy adopts the
      # full schema in this PR (was on a minimal `**Version**:`-only
      # header until now).
      - name: Lint AGENTS.md header schema
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       AGENTS.md header-schema lint                         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-lint-agents-md-header

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Async-route audit (Phase 4 — enforced).
  # Catches the BUG-JD-10 bug class (sync-blocking calls inside async def
  # route handlers). Hard-fails on any new violation; this repo reached
  # zero visible violations at end of Phase 3 (PR #247). Per-file-ignores
  # live in pyproject.toml [tool.ruff.lint.per-file-ignores].
  # See juniper-ml notes/ASYNC_ROUTE_AUDIT_HOOK_MIGRATION_PLAN.md §4.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  async-route-audit:
    name: Async-route audit (BUG-JD-10 class)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install "ruff==0.15.6"

      - name: Run async-route audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Async-route audit (BUG-JD-10)       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          ruff check --select ASYNC --output-format=github src/

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Docker Build & Smoke Test: Verify Dockerfile builds and container starts
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build Docker Image
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Docker Build                        ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          docker build -t juniper-canopy:ci-${{ github.sha }} .

      - name: Verify Container Starts
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Docker Smoke Test                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # SEC-F22 / D2: the Dockerfile ships a loopback in-container default
          # (JUNIPER_CANOPY_SERVER__HOST=127.0.0.1), which a published port
          # cannot reach (docker forwards to the container's eth0, not its
          # loopback) -- the in-container HEALTHCHECK passes while the runner's
          # curl gets connection-refused. Per the Dockerfile's documented
          # published-port posture, override the in-container bind to 0.0.0.0
          # AND attest it, and keep the runner-side publish loopback-only so
          # the attested loopback-publish perimeter is actually true here.
          docker run -d --name juniper-canopy-test \
            -p 127.0.0.1:8050:8050 \
            -e JUNIPER_CANOPY_SERVER__HOST=0.0.0.0 \
            -e JUNIPER_CANOPY_LOOPBACK_PUBLISH_ATTESTED=true \
            juniper-canopy:ci-${{ github.sha }}

          echo "Waiting for service to become healthy..."
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' juniper-canopy-test 2>/dev/null | grep -q healthy; then
              echo "Service is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::Service did not become healthy within 30 attempts"
              docker logs juniper-canopy-test
              exit 1
            fi
            sleep 2
          done

      - name: Verify Package Import
        run: |
          docker exec juniper-canopy-test python -c "import juniper_canopy; print(juniper_canopy.__version__)"

      - name: Verify Health Endpoint
        run: |
          curl -sf http://localhost:8050/v1/health | python3 -m json.tool

      - name: Cleanup
        if: always()
        run: |
          docker stop juniper-canopy-test 2>/dev/null || true
          docker rm juniper-canopy-test 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Memory Budget (BLOCKING, standalone): P5 port of juniper-ml's size ratchet.
  # Plan: juniper-ml notes/JUNIPER_2026-08-18_JUNIPER-ML_SHARED-SESSION-MEMORY-PLAN.md (§P5).
  #
  # WHY THE RATE AXIS SHIPS FIRST, AND ALONE. juniper-ml's AGENTS.md grew ~20x in six months
  # WHILE UNDER FOUR ACTIVE CI GATES -- every one of them enforced structure or currency and
  # none enforced SIZE; 172 of 200 main-line merges grew it against 14 that shrank it, by 2,628
  # bytes between them. A cut without a ceiling is undone in ~44 days, and a ceiling set AFTER a
  # cut locks in the inflated level. So the ceiling lands first and the cut comes later; this job
  # carries no relocation check yet, because canopy has not cut anything to check.
  #
  # STANDALONE, and deliberately ABSENT from the `required-checks` Quality Gate `needs:` (plan
  # correction C9). A `needs:` entry is the wrong promotion mechanism: it makes a skip on a
  # non-PR event fail the gate. Promotion happens in the branch RULESET, the same way Sequence
  # Safety was promoted -- and only after the soak below, which ended 2026-08-26.
  #
  # BLOCKING as of 2026-08-26 (plan §P5 step d). The job soaked with `--advisory` from the port's merge,
  # and the flag was removed only after three negative controls passed IN THIS REPO against the
  # non-advisory invocation -- clean tree exits 0, growth past the ceiling exits 1, and a waiver
  # trailer exits 0 -- because a blocking gate that cannot fail is worse than none. Whether this
  # context is REQUIRED is decided in the branch ruleset, never here.
  #
  # SLACK, MEASURED HERE. The ceiling was seeded at the exact size on the day the port landed
  # (95,133 chars, zero slack) and raised 2026-08-26 to 97,133 (+2,000) under an Allow-Ceiling-
  # Raise: AGENTS.md trailer. The slack is the largest single AGENTS.md-growing commit re-measured
  # over the 30 days to 2026-08-26 (1,982; median 1,982, 2 grew / 0 shrank, ~81 chars/day),
  # floored at 2,000 because one fleet-wide docs fan-out (2026-08-21) added 1,982 chars to six
  # repos' AGENTS.md at once -- the shape a zero-slack ceiling cannot absorb. Growth past the
  # ceiling now FAILS this check; Allow-Budget-Overrun: AGENTS.md is the loan for a warranted
  # overrun, and a cut is what brings the ceiling back down (hand-edit with slack, never bare
  # --ratchet).
  memory-budget:
    name: Memory Budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base tip to apply the no-worsening rule

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Check memory-file size budget
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║      juniper-canopy - Memory File Size Budget (BLOCKING)   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # canopy targets main AND develop, so the base is read from the event rather
          # than hardcoded; merge_group has no github.base_ref, hence the fallback.
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF"
          # Allow-Budget-Overrun is a LOAN, not a pass: it suppresses the failure without moving
          # the ceiling, so the debt still blocks the next author. Trailers are injected from an
          # explicit file (the checker never shells out for them) so the classifier stays pure.
          # Two-dot FETCH_HEAD..HEAD = exactly the commits this PR adds on top of base.
          git log --format=%B FETCH_HEAD..HEAD > memory-budget-trailers.txt
          # BLOCKING as of 2026-08-26: `--advisory` (the soak setting) is gone, so a violation exits 1 and
          # fails this check. Escape hatch, when the growth is genuinely warranted: add the commit trailer
          #   Allow-Budget-Overrun: AGENTS.md
          # and carry it into the SQUASH message -- squash composes from the commit messages, so
          # a trailer left only in the PR body is silently discarded.
          python3 util/memory_budget_check.py \
            --base-ref FETCH_HEAD \
            --trailers-file memory-budget-trailers.txt

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Required Checks Aggregator: Final quality gate
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, unit-tests, integration-tests, ui-tests, security, build, dependency-docs, lockfile-check, docs, docker-build]

    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Quality Gate Status                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:        ${{ needs.pre-commit.result }}"
          echo "Unit Tests:        ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "UI Tests:          ${{ needs.ui-tests.result }}"
          echo "Security:          ${{ needs.security.result }}"
          echo "Build:             ${{ needs.build.result }}"
          echo "Dependency Docs:   ${{ needs.dependency-docs.result }}"
          echo "Documentation:     ${{ needs.docs.result }}"
          echo "Lockfile Check:    ${{ needs.lockfile-check.result }}"
          echo "Docker Build:      ${{ needs.docker-build.result }}"
          echo ""

          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "::error::Security scans failed"
            exit 1
          fi

          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "::error::Integration tests failed"
            exit 1
          fi

          # UI tests: failure = error, skipped = OK (only runs on PRs and main/develop)
          if [[ "${{ needs.ui-tests.result }}" == "failure" ]]; then
            echo "::error::UI sub-suite (Playwright) failed"
            exit 1
          fi

          # Dependency docs: failure = error, skipped = OK (non-blocking)
          if [[ "${{ needs.dependency-docs.result }}" == "failure" ]]; then
            echo "::error::Dependency documentation generation failed"
            exit 1
          fi

          # Documentation links: failure = error
          if [[ "${{ needs.docs.result }}" == "failure" ]]; then
            echo "::error::Documentation link validation failed"
            exit 1
          fi

          # Lockfile must be fresh (stale lockfile = Docker builds don't match CI)
          if [[ "${{ needs.lockfile-check.result }}" != "success" ]]; then
            echo "::error::Lockfile freshness check failed — requirements.lock is stale"
            exit 1
          fi

          # Docker build: failure = error, skipped = OK (only runs on PRs and main/develop)
          if [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "::error::Docker build and smoke test failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED ✓"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Notify: Build status notification
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [required-checks]
    if: always()

    steps:
      - name: Build Status Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Canopy - Build Complete                      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "========== CI/CD Pipeline Summary =============================="
          echo "Status:   ${{ needs.required-checks.result }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Actor:    ${{ github.actor }}"
          echo "Event:    ${{ github.event_name }}"
          echo "================================================================"
