---
#####################################################################################################################################################################################################
# Project:       Juniper
# File Name:     scheduled-tests.yml (template)
#
# Description:
#    Canonical "slow / nightly" tests workflow. Drop into a target repo's
#    `.github/workflows/scheduled-tests.yml`. Two TODOs to customize per
#    repo:
#      1. PYTHON_TEST_VERSION — match the repo's preferred test Python
#         (3.12 for most; 3.11 for juniper-cascor-client; 3.14 for
#         juniper-cascor's existing workflow).
#      2. The `pytest -m` selector — repos with `slow` markers should
#         use `slow or integration`; repos without should use just
#         `integration`.
#
#    juniper-cascor already ships a richer scheduled-tests.yml (slow
#    unit + slow integration + long-running + benchmarks). That richer
#    flavor is *not* generalized in this template — keep it as
#    juniper-cascor's local override.
#####################################################################################################################################################################################################

name: Scheduled Tests

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_TEST_VERSION: "3.12"

jobs:
  slow-or-integration-tests:
    name: Slow / Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          # Match the main ci.yml unit-tests job: torch from the CPU index
          # (canopy's demo_mode.py and demo_backend.py import torch at
          # module load), then conf/requirements_ci.txt (the pinned CI
          # surface incl. pytest>=9.0 + pytest-* siblings), then the repo
          # itself in editable mode. The earlier ``.[test]`` shape silently
          # no-op'd because canopy has no ``[test]`` extra in pyproject —
          # pip warned but exit-0'd so the ``||`` fallback chain never
          # fired, leaving pytest itself uninstalled. Every scheduled run
          # since the workflow was added has failed with
          # ``No module named pytest``.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r conf/requirements_ci.txt
          # Install the [juniper-cascor] extra, exactly as ci.yml's unit-test job
          # does. Without it ``src/tests/conftest.py`` injects a stub for
          # ``juniper_cascor_client`` that registers only the top-level module,
          # ``.exceptions`` and ``.client`` — NOT ``.constants`` — while
          # ``src/backend/cascor_service_adapter.py`` imports
          # ``ENDPOINT_TRAINING_START`` from ``juniper_cascor_client.constants``
          # (added 2026-07-20 17:57 by #459). Four test modules that import
          # ``CascorServiceAdapter`` at module scope then die at COLLECTION, which
          # exits this job 1 regardless of the 413 tests that do pass, and five
          # more in ``test_n5_apply_params_ux.py`` silently importorskip.
          # Dated precisely: the last green run of this workflow was 2026-07-20,
          # and every run from 2026-07-21 to 2026-09-21 failed — a 63-run streak
          # opened by #459 the evening before. (Retention goes back to 2026-05-01
          # and holds 58 successes, so this lane is not simply always-red.)
          # ci.yml's INTEGRATION lane already carries this exact fix, for this
          # exact reason — see its N3 comment naming ``.constants``. It was never
          # propagated here, and canopy is the only Juniper repo whose scheduled
          # lane installs no extra at all (the rest use ``[all]`` or ``[test]``).
          # The extra is one pure-Python universal wheel
          # (``juniper_cascor_client-0.8.0-py3-none-any.whl``, requires-python
          # >=3.12), so it resolves on every leg of the 3.12/3.13/3.14 matrix.
          pip install -e ".[juniper-cascor]"

      - name: Run slow / integration tests
        run: |
          mkdir -p reports/junit
          python -m pytest \
            -m "slow or integration" \
            --tb=short \
            --maxfail=10 \
            --junitxml=reports/junit/junit-slow.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: scheduled-test-results-${{ matrix.python-version }}
          path: reports/junit/
          retention-days: 30
