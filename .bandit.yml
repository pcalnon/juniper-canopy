# Bandit Security Configuration for Juniper Canopy
# Version: 1.0.0
# Date: 2026-02-04
#
# This file defines security scan configuration for Bandit SAST tool.
# Document any skipped checks with justification.

# Exclude test files from security scans (test code uses assert, random, etc.)
exclude_dirs:
  - src/tests
  - util/verification

# Skipped tests with justification
skips:
  # B101: assert used in runtime checks and Dash callback guards.
  # Production code paths do not rely on assert for security enforcement.
  - B101

  # B113: requests calls without timeout. Timeouts are enforced at the
  # middleware/adapter level; individual call sites use shared HTTP clients.
  - B113

  # B311: pseudo-random generators (random module) not suitable for crypto.
  # Used only for demo mode data generation, not security/cryptographic purposes.
  - B311

# Tests to run (all by default minus skipped)
# Uncomment specific tests to include only those
# tests: []

# Confidence level threshold
# LOW, MEDIUM, HIGH
confidence: MEDIUM

# Severity level threshold
# LOW, MEDIUM, HIGH
severity: MEDIUM

# Output settings for CI
# aggregate: file - group results by file
# aggregate: vuln - group results by vulnerability type
aggregate: vuln
